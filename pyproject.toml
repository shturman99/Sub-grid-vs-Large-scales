[project]
name = "sub-grid-vs-large-scales"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "dill>=0.4.1",
    "f90nml>=1.5",
    "h5py>=3.16.0",
    "matplotlib>=3.11.2",
    "numpy>=2.5.4",
    "scipy>=1.18.1",
]

[dependency-groups]
dev = [
    "ipykernel>=7.4.0",
    "pytest>=9.1.1",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
